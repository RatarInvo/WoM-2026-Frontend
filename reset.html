<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password</title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <!-- bootstrap icons + google font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <!-- file links -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/theme.js"></script>
    <script src="js/reset.js" defer></script>
    <script src="js/api.js"></script>
</head>
<body>
    <button type="button" id="theme_toggle" class="theme_toggle theme_toggle_floating" aria-label="Switch to light mode">
        <i class="bi bi-sun"></i>
    </button>

    <main class="login_page">
        <section class="login_card">
            <!-- header -->
            <header class="login_header">
                <h1 class="login_title">Set a new password</h1>
                <p class="login_subtitle">Choose a new password for your account</p>
            </header>

            <form class="login_form" id="reset_password_form" novalidate>
                <!-- new password field -->
                <div class="form_group">
                    <label class="form_label" for="new_password">New password</label>
                    <div class="input_wrapper">
                        <i class="bi bi-lock input_icon"></i>
                        <input
                            class="form_input has_toggle"
                            type="password"
                            id="new_password"
                            name="new_password"
                            placeholder="Enter a new password"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password_toggle" id="new_password_toggle" aria-label="Show password">
                            <i class="bi bi-eye" id="new_password_toggle_icon"></i>
                        </button>
                    </div>
                </div>

                <!-- confirm new password field -->
                <div class="form_group">
                    <label class="form_label" for="confirm_password">Confirm new password</label>
                    <div class="input_wrapper">
                        <i class="bi bi-lock input_icon"></i>
                        <input
                            class="form_input has_toggle"
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Repeat your new password"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password_toggle" id="confirm_password_toggle" aria-label="Show password">
                            <i class="bi bi-eye" id="confirm_password_toggle_icon"></i>
                        </button>
                    </div>
                </div>

                <!-- feedback messages, hidden by default -->
                <p class="error_message" id="error_message"></p>
                <p class="success_message" id="success_message"></p>

                <button type="submit" class="login_button">Reset password</button>
            </form>

            <p class="form_footer"><a href="login.html" class="signup_link">Back to sign in</a></p>
        </section>
    </main>
</body>
</html>
