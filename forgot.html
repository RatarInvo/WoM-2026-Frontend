<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password</title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <!-- bootstrap icons + google font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <!-- file links -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/theme.js"></script>
    <script src="js/forgot.js" defer></script>
</head>
<body>
    <button type="button" id="theme_toggle" class="theme_toggle theme_toggle_floating" aria-label="Switch to light mode">
        <i class="bi bi-sun"></i>
    </button>

    <main class="login_page">
        <section class="login_card">
            <!-- header -->
            <header class="login_header">
                <h1 class="login_title">Reset your password</h1>
                <p class="login_subtitle">Enter your email and we'll send you a reset link</p>
            </header>

            <form class="login_form" id="forgot_password_form" novalidate>
                <!-- email field -->
                <div class="form_group">
                    <label class="form_label" for="email">Email</label>
                    <div class="input_wrapper">
                        <i class="bi bi-envelope input_icon"></i>
                        <input
                            class="form_input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <!-- feedback messages, hidden by default -->
                <p class="error_message" id="error_message"></p>
                <p class="success_message" id="success_message"></p>

                <button type="submit" class="login_button" id="submit_button">Send reset link</button>
            </form>

            <p class="form_footer">Remembered your password? <a href="login.html" class="signup_link">Sign in</a></p>
        </section>
    </main>
</body>
</html>
