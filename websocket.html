<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Pastebin</title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/pastebin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <button id="settings-button" class="icon-button" type="button" aria-label="Settings">
        <i class="bi bi-gear-fill" aria-hidden="true"></i>
    </button>

    <main class="card">
        <div class="card_header">
            <div>
                <p class="eyebrow">Workspace utility</p>
                <h1>WebSocket Pastebin</h1>
            </div>
            <a href="index.html" class="notes_link">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                Notes
            </a>
        </div>
        <textarea id="paste" rows="1" placeholder="Paste text here" aria-label="Paste text"></textarea>
        <div id="log" class="log" aria-live="polite"></div>
        <div class="status-row">
            <span id="status" class="status">Not connected</span>
            <button id="reconnect" type="button" hidden>Reconnect</button>
        </div>
    </main>

    <dialog id="settings">
        <form id="settings-form" method="dialog">
            <h2>Log in</h2>
            <p id="settings-message" class="settings-message" hidden></p>
            <label for="token">JWT access token</label>
            <input id="token" type="text" autocomplete="off" placeholder="Paste your JWT" />
            <label for="server">WebSocket server URL</label>
            <input id="server" type="text" value="ws://localhost:4000" placeholder="ws://localhost:4000"/>
            <div class="dialog-buttons">
                <button id="logout" type="button" class="secondary">Log out</button>
                <button id="close-settings" type="button" class="secondary">Cancel</button>
                <button type="submit">Save and connect</button>
            </div>
        </form>
    </dialog>

    <script src="js/pastebin.js"></script>
</body>
</html>
